<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Падение: прототип</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #15171a;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      background: #24282d;
      touch-action: none;
    }
    button {
      font: inherit;
      color: #15171a;
      background: #e6e8ea;
      border: 0;
      border-radius: 8px;
      padding: 14px 28px;
    }
    #start {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      font: 18px sans-serif;
      color: #e6e8ea;
      text-align: center;
      background: rgba(21, 23, 26, 0.92);
    }
    #start p {
      margin: 0;
    }
    #restart {
      position: fixed;
      top: 12px;
      right: 12px;
      display: none;
      padding: 10px 14px;
      font: 16px sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <button id="restart" type="button">Заново</button>
  <div id="start">
    <p>Держи телефон вертикально и поворачивай влево и вправо, как руль.</p>
    <p>Если экран поворачивается вместе с телефоном, включи блокировку поворота.</p>
    <button id="startButton" type="button">Начать</button>
    <p id="startMessage"></p>
  </div>
  <script src="lib/planck.min.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
